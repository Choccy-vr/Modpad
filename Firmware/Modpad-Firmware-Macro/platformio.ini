; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ch32v203f6p6]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
; no F6P6 board with Arduino support, so borrow the C8T6 and swap in the G6 variant (same 32K/10K die)
board = genericCH32V203C8T6
framework = arduino
board_build.mcu = ch32v203f6p6
board_build.arduino.openwch.variant = CH32V20x/CH32V203G6
board_build.arduino.openwch.variant_h = variant_CH32V203G6.h
board_upload.maximum_size = 32768
board_upload.maximum_ram_size = 10240
; WCH-LinkE on the debug header (SWDIO/SWCLK), use "isp" for the USB bootloader instead
upload_protocol = wch-link
monitor_speed = 115200
build_flags =
	-DSERIAL_UART_INSTANCE=2 ; PA2/PA3, the F6P6 has no USART1 pins
	-Wl,--defsym=__FLASH_SIZE=32K
	-Wl,--defsym=__RAM_SIZE=10K
